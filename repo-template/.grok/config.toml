# Shared project policy for Grok Build. Personal model, authentication, UI, and
# sandbox defaults belong in ~/.grok/config.toml or managed requirements files.

[permission]
rules = [
  { action = "deny", tool = "bash", pattern = "git commit" },
  { action = "deny", tool = "bash", pattern = "git commit *" },
  { action = "deny", tool = "bash", pattern = "git push" },
  { action = "deny", tool = "bash", pattern = "git push *" },
  { action = "deny", tool = "bash", pattern = "git reset --hard *" },
  { action = "deny", tool = "bash", pattern = "git clean *" },
  { action = "deny", tool = "bash", pattern = "rm -rf *" },
]
